version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ced-postgres
    environment:
      POSTGRES_USER: ced_user
      POSTGRES_PASSWORD: ced_password
      POSTGRES_DB: ced
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ced_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

